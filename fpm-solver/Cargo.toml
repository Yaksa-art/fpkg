[package]
name = "fpm-solver"
version = "0.1.3"
edition = "2021"
description = "M1 Dependency Solver — PubGrub-based dependency resolution for fpkg"
license = "Apache-2.0"

[lib]
name = "fpm_solver"
path = "src/lib.rs"

[[bin]]
name = "fpm-solver"
path = "src/main.rs"

[dependencies]
anyhow   = "=1.0.75"
clap     = { version = "=4.4.6", features = ["derive"] }
pubgrub  = "=0.2.1"
serde    = { version = "=1.0.189", features = ["derive"] }
toml     = "=0.7.8"

[dev-dependencies]
pretty_assertions = "=1.4.0"
