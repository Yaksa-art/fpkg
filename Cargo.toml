[workspace]
resolver = "2"

members = [
    "fpm-core",
    "fpm-db",
    "fpm-fetcher",
    "fpm-hooks",
    "fpm-index",
    "fpm-installer",
    "fpm-solver",
    "fpm-verifier",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["FsocietyOS contributors"]
repository  = "https://github.com/yaksa-art/fpkg"

[workspace.dependencies]
anyhow          = "1"
thiserror       = "1"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
toml            = "0.8"
chrono          = { version = "0.4", features = ["serde"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap            = { version = "4", features = ["derive"] }
tempfile        = "3"
blake3          = "1"
rusqlite        = { version = "0.31", features = ["bundled"] }
r2d2            = "0.8"
r2d2_sqlite     = "0.22"
reqwest         = { version = "0.11", features = ["blocking", "json"] }
rmp-serde       = "1"
walkdir         = "2"
zip             = { version = "0.6", default-features = false, features = ["deflate"] }
