[package]
name = "fpkg-db"
version = "0.1.2"
edition = "2021"
description = "M8 Local Database — SQLite-backed package tracking for fpkg"
license = "Apache-2.0"

[lib]
name = "fpkg_db"
path = "src/lib.rs"

[[bin]]
name = "fpkg-db"
path = "src/main.rs"

[dependencies]
anyhow    = "=1.0.75"
chrono    = { version = "=0.4.31", features = ["clock"] }
clap      = { version = "=4.4.6", features = ["derive"] }
rusqlite  = { version = "=0.31.0", features = ["bundled"] }
serde     = { version = "=1.0.189", features = ["derive"] }
serde_json = "=1.0.107"
