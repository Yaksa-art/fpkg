[package]
name = "fpm-hooks"
version = "0.1.0"
edition = "2021"
description = "M7 Hooks — sandboxed pre/post-install script runner (bwrap/seccomp)"

[lib]
name = "fpm_hooks"
path = "src/lib.rs"

[[bin]]
name = "fpm-hooks"
path = "src/main.rs"

[dependencies]
thiserror = "1"
anyhow    = "1"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde     = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
