[package]
name = "fpm-fetcher"
version = "0.1.3"
edition = "2021"
description = "M2 Fetcher — async parallel downloader with resume, BLAKE3 verify, and cache"
license = "Apache-2.0"

[lib]
name = "fpm_fetcher"
path = "src/lib.rs"

[[bin]]
name = "fpm-fetcher"
path = "src/main.rs"

[dependencies]
anyhow      = "=1.0.75"
blake3      = "=1.5.0"
clap        = { version = "=4.4.6", features = ["derive"] }
futures     = "=0.3.29"
reqwest     = { version = "=0.11.22", default-features = false, features = ["stream", "rustls-tls"] }
serde       = { version = "=1.0.189", features = ["derive"] }
tokio       = { version = "=1.33.0", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync", "time"] }
toml        = "=0.7.8"

[dev-dependencies]
wiremock    = "=0.5.22"
tokio       = { version = "=1.33.0", features = ["rt-multi-thread", "macros"] }
