[package]
name = "fpm-fetcher"
version = "0.1.0"
edition = "2021"
description = "M2 Fetcher — async package downloader for fpm"

[[bin]]
name = "fpm-fetcher"
path = "src/main.rs"

[lib]
name = "fpm_fetcher"
path = "src/lib.rs"

[dependencies]
# shared types from M1 Solver
fpm-solver = { path = "../fpm-solver" }

# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# progress / channels
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# error handling
thiserror = "1"
anyhow = "1"

# misc
blake3 = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[build-dependencies]
# FFI bindings to M3 Verifier (libfpm_verifier.a)
# Generated via bindgen or manual extern block in src/verifier_ffi.rs
# Uncomment when libfpm_verifier.a is built:
# bindgen = "0.69"
