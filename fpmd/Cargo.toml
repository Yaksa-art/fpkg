[package]
name = "fpmd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fpm daemon — Unix socket + JSON-RPC 2.0 orchestrator"

[[bin]]
name = "fpmd"
path = "src/main.rs"

[dependencies]
fpm-core      = { path = "../fpm-core" }
fpm-db        = { path = "../fpm-db" }
fpm-fetcher   = { path = "../fpm-fetcher" }
fpm-index     = { path = "../fpm-index" }
fpm-installer = { path = "../fpm-installer" }
fpm-solver    = { path = "../fpm-solver" }
anyhow.workspace    = true
thiserror.workspace = true
serde               = { workspace = true }
serde_json.workspace = true
toml.workspace      = true
chrono.workspace    = true
tracing.workspace   = true
tracing-subscriber.workspace = true
clap.workspace      = true

[dev-dependencies]
tempfile.workspace = true
